name: Node.js CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 26
    - name: Test backend calculations
      working-directory: backend
      run: npm test

  build-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 26
    - name: Install frontend dependencies
      working-directory: frontend
      run: npm ci
    - name: Test frontend calculations
      working-directory: frontend
      run: npm test
    - name: Lint frontend
      working-directory: frontend
      run: npm run lint
    - name: Build frontend
      working-directory: frontend
      run: npm run build
